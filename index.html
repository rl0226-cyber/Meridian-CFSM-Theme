<!doctype html>
<html lang="en" data-theme="rose">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf0f2">
  <!-- Leave blank for same-origin deployments; static or cross-origin setups may list Worker origins, separated by commas. -->
  <meta name="apiBase" content="">
  <title>CF Server Monitor</title>
  <link rel="stylesheet" href="assets/app.css">
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div id="app" class="app-shell">
    <header id="site-header" class="site-header"></header>
    <main id="main-view" class="main-view" aria-live="polite">
      <div class="loading-state"><span class="loader"></span><span>Connecting to monitored nodes…</span></div>
    </main>
    <section id="gate-area" class="gate-area" aria-live="polite"></section>
    <footer class="site-footer">
      <span>Live infrastructure, quietly observed.</span>
      <a id="powered-link" href="https://github.com/huilang-me/CF-Server-Monitor/" target="_blank" rel="noreferrer" title="Powered by CF-Server-Monitor">Powered by CF-Server-Monitor</a>
    </footer>
  </div>
  <noscript>This theme needs JavaScript enabled to load server monitoring data.</noscript>
</body>
</html>
