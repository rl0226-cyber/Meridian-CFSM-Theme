<!doctype html>
<html lang="en" data-theme="romance">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf0f2">
  <link rel="icon" href="assets/mark-romance.svg" type="image/svg+xml" data-romance="assets/mark-romance.svg" data-umbrella="assets/mark-umbrella.svg">
  <script>
    try {
      const saved = localStorage.getItem('meridian.site.tone');
      const legacy = localStorage.getItem('cfsm-theme-tone');
      document.documentElement.dataset.theme = saved === 'umbrella' || saved === 'romance'
        ? saved : legacy === 'night' ? 'umbrella' : 'romance';
      const themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) themeColor.content = document.documentElement.dataset.theme === 'umbrella' ? '#0a0a0b' : '#fbf0f2';
      const themeIcon = document.querySelector('link[rel="icon"][data-umbrella]');
      if (themeIcon) themeIcon.href = themeIcon.getAttribute(document.documentElement.dataset.theme === 'umbrella' ? 'data-umbrella' : 'data-romance');
    } catch { /* storage can be disabled */ }
  </script>
  <!-- CFSM serves this theme and API through the same Worker origin, so leave apiBase blank. -->
  <meta name="apiBase" content="">
  <title>CF Server Monitor</title>
  <link rel="stylesheet" href="assets/app.css">
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div id="app" class="app-shell">
    <header id="site-header" class="site-header"></header>
    <main id="main-view" class="main-view" aria-live="polite">
      <div class="loading-state"><span class="loader"></span><span>Connecting to monitored nodes…</span></div>
    </main>
    <section id="gate-area" class="gate-area" aria-live="polite"></section>
    <footer class="site-footer">
      <span>Live infrastructure, quietly observed.</span>
      <a id="powered-link" href="https://github.com/huilang-me/CF-Server-Monitor/" target="_blank" rel="noreferrer" title="Powered by CF-Server-Monitor">Powered by CF-Server-Monitor</a>
    </footer>
  </div>
  <noscript>This theme needs JavaScript enabled to load server monitoring data.</noscript>
</body>
</html>
